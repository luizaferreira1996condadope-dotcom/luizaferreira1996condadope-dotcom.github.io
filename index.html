<style>
:root{--bg:#F4F2EA;--card:#FFFFFF;--ink:#1C281D;--muted:#5F6E62;--line:#E2DCC9;--head:#33521F;--gold:#D8C07A;--ok:#2D6A25;--okbg:#E2EFDB;--warn:#8A5800;--warnbg:#F8ECD0;--bad:#A4161A;--badbg:#F7E0DE;--wait:#5F6E62;--waitbg:#ECE9DD}
@media (prefers-color-scheme:dark){:root{--bg:#101510;--card:#182018;--ink:#E8EDE3;--muted:#9BA89D;--line:#2A342A;--head:#1D3113;--ok:#8ED186;--okbg:#1B2E1C;--warn:#E8B85C;--warnbg:#33270F;--bad:#F2908A;--badbg:#3A1817;--wait:#9BA89D;--waitbg:#1C241C;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--head);color:#F7F2E2;padding:14px 16px;display:flex;gap:12px;align-items:center}
header img{width:48px;height:48px;border-radius:8px;background:#fff;padding:2px;object-fit:contain;flex:none}
header b{display:block;font-size:13px;line-height:1.25;color:var(--gold)}header span{font-size:12px;opacity:.85}
main{max-width:520px;margin:0 auto;padding:18px 16px 32px;display:flex;flex-direction:column;gap:14px}
.st{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}.st h1{margin:0;font-size:22px;line-height:1.2}.st p{margin:0}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.wait{background:var(--waitbg);color:var(--wait)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:flex-start}
.foto{width:104px;height:130px;object-fit:cover;border-radius:10px;border:2px solid #C8A951;flex:none}
dl{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
footer{font-size:12.5px;color:var(--muted)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--head);color:#F7F2E2;cursor:pointer;align-self:flex-start;margin-top:8px}
[hidden]{display:none!important}
</style>

<section class="st wait" id="st"><h1 id="tt">Consultando…</h1><p id="dt">Buscando a situação desta carteira na associação.</p><button id="rt" hidden>Tentar de novo</button></section>

<footer id="ft">Confira se a foto e o nome batem com a carteira apresentada.</footer>

<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbyiAe_sEbwo043633numnPozhRatPqfqMLuDPJZxClUtFuTOVaDnBQRSmxMLdIHKVfC_w/exec";
  var v = new URLSearchParams(location.search).get("v");
  if (!v) { location.replace(API); return; }
  var $ = function (id) { return document.getElementById(id); };
  function txt(el, t) { el.textContent = t == null ? "" : String(t); }
  function campo(dl, k, val) { if (!val) return; var d = document.createElement("div"), a = document.createElement("dt"), b = document.createElement("dd"); txt(a, k); txt(b, val); d.appendChild(a); d.appendChild(b); dl.appendChild(d); }
  function status(cls, t, d) { $("st").className = "st " + cls; txt($("tt"), t); txt($("dt"), d); }
  function mostrar(r) {
    if (r.assoc) {
      if (r.assoc.nome) txt($("an"), r.assoc.nome);
      txt($("ac"), ["AGROBONITO", r.assoc.cnpj ? "CNPJ " + r.assoc.cnpj : "", [r.assoc.municipio, r.assoc.uf].filter(Boolean).join("-")].filter(Boolean).join(" · "));
    }
    status(r.status === "ok" || r.status === "warn" ? r.status : "bad", r.titulo, r.detalhe);
    var cd = $("cd"); cd.innerHTML = "";
    if (r.socio) {
      if (r.socio.foto && /^data:image\//.test(r.socio.foto)) { var im = document.createElement("img"); im.className = "foto"; im.alt = "Foto do(a) sócio(a)"; im.src = r.socio.foto; cd.appendChild(im); }
      var dl = document.createElement("dl");
      campo(dl, "Nome", r.socio.nome); campo(dl, "Matrícula", r.socio.matricula || "—"); campo(dl, "Lote / Parcela", r.socio.lote); campo(dl, "Validade da carteira", r.socio.validade);
      cd.appendChild(dl); cd.hidden = false;
    } else cd.hidden = true;
    txt($("ft"), "Consulta feita em " + (r.consulta || "") + ". Confira se a foto e o nome batem com a carteira apresentada." + (r.assoc && r.assoc.email ? " Dúvidas: " + r.assoc.email : ""));
  }
  function consultar() {
    $("rt").hidden = true; status("wait", "Consultando…", "Buscando a situação desta carteira na associação.");
    fetch(API + "?api=1&v=" + encodeURIComponent(v), { credentials: "omit", cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
      .then(mostrar)
      .catch(function () { status("bad", "Não foi possível consultar agora", "Verifique a internet do celular e tente de novo."); $("rt").hidden = false; });
  }
  $("rt").addEventListener("click", consultar);
  consultar();
})();
</script>
